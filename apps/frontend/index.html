<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تيسير" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>تيسير</title>
    <style>
      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(160deg, #0c1929 0%, #1d4ed8 40%, #3b82f6 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
        overflow: hidden;
      }

      #splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      /* Decorative circles */
      #splash-screen::before,
      #splash-screen::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        opacity: 0.08;
        background: white;
      }
      #splash-screen::before {
        width: 600px;
        height: 600px;
        top: -200px;
        right: -150px;
      }
      #splash-screen::after {
        width: 400px;
        height: 400px;
        bottom: -100px;
        left: -100px;
      }

      .splash-logo-container {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splashPulse 2.5s ease-in-out infinite;
      }

      .splash-logo-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
      }

      .splash-logo-icon {
        position: relative;
        z-index: 1;
      }

      .splash-app-name {
        margin-top: 32px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 32px;
        font-weight: 800;
        color: white;
        letter-spacing: -0.5px;
      }

      .splash-tagline {
        margin-top: 10px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 500;
      }

      .splash-loader {
        margin-top: 48px;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-logo-container">
        <div class="splash-logo-bg"></div>
        <svg class="splash-logo-icon" width="80" height="80" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Shopping bag body -->
          <path d="M120 170 L392 170 L368 430 Q366 455 342 457 L170 457 Q146 455 144 430 Z" fill="#3b82f6" opacity="0.9"/>
          <!-- Shopping bag handle -->
          <path d="M195 170 Q195 95 256 95 Q317 95 317 170" fill="none" stroke="white" stroke-width="32" stroke-linecap="round"/>
          <!-- Store front inside bag -->
          <rect x="195" y="230" width="122" height="90" rx="8" fill="white" opacity="0.2"/>
          <path d="M210 320 L256 280 L302 320 Z" fill="white" opacity="0.3"/>
          <!-- Checkmark -->
          <circle cx="256" cy="370" r="22" fill="white"/>
          <path d="M244 370 L253 380 L270 358" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="splash-app-name">تيسير</div>
      <div class="splash-tagline">Gestion de Magasin</div>
      <div class="splash-loader"></div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hide splash screen when React loads -->
    <script>
      (function() {
        function hideSplash() {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() {
              splash.remove();
            }, 500);
          }
        }
        // Fallback: if React hasn't mounted after 3 seconds, remove splash anyway
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) hideSplash();
        }, 3000);
      })();
    </script>
  </body>
</html>
